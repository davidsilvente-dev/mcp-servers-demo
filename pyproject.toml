[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-boe-demo"
version = "0.1.0"
description = "Servidor MCP de demostración sobre los datos abiertos del BOE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Silvente López" }]
dependencies = ["mcp[cli]>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.scripts]
mcp-boe = "mcp_boe.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
